name: Python Data Science CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install jupyter nbconvert 

    - name: Execute Jupyter Notebook
      run: |
        # این دستور نوت‌بوک را اجرا می‌کند و اگر خطایی بدهد، CI شکست می‌خورد
        jupyter nbconvert --to notebook --execute bike_sharing_project.ipynb --output executed_notebook.ipynb --ExecutePreprocessor.timeout=600
